<div class="card">
    <p-table
      [resizableColumns]="true"
      styleClass="p-datatable-gridlines"
      responsiveLayout="scroll"
      [value]="items"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pResizableColumn>Message</th>
          <th *ngIf="template?.propertiesSupport?.length" pResizableColumn>
            Properties Support
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body">
        <tr>
          <td>
            
            <div class="row mt-2">
              <div class="col-md-12">
                <p-editor
                  id="numberitiont"
                  #editor 
                  [(ngModel)]="template.bodyMessage"
                  [style]="{ height: '35vh' }"
                ></p-editor>
              </div>
            </div>
          </td>
          <td *ngIf="template?.propertiesSupport?.length">
            <ul class="grid-col-1">
              <li *ngFor="let property of template.propertiesSupport">
                <button class="property" (click)="addProperty(property)">  {{ property }}</button>
              </li>
            </ul>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  <div class="row justify-content-end text-right mt-2">
    <div class="col">
      <p-button
        label="Close"
        icon="pi pi-times"
        styleClass="p-button-sm p-button-secondary"
        (onClick)="ref.close()"
      ></p-button>
  
      <p-button
        [disabled]="isSaving"
        label="Save"
        icon="pi pi-check"
        styleClass="p-button-sm ml-2"
        (click)="save()"
      ></p-button>
    </div>
  </div>
