<div class="breadcrumb header">
  <div class="w-100 d-flex justify-content-between">
    <div>
      <talent-section-breadcrumb [breadcrumbConfig]="breadcrumbConfig"></talent-section-breadcrumb>
    </div>
    <div>
      <button class="btn btn-success ml-2"
        *ngIf="permission.isGranted(PS.Pages_Reports_Intern_Education_Export)"
        (click)="exportInternEducation()">
        <i class="pi pi-downloadm fa-edownload mr-1"></i>
        Export
      </button>
    </div>
  </div>
</div>

<section class="section-table" id="report-education">
  <div class="card">
    <div class="card-header">
      <div class="row">
        <div class="col-12 col-md-8 item-group">
          <talent-date-selector
            [label]="'Time'"
            [defaultOption]="defaultOptionTime"
            (selectChange)="onTalentDateChange($event)"
            class="talent-date">
          </talent-date-selector>
        </div>
        <div class="col-12 col-md-4 item-group">
          <label for="branch" class="mr-2">{{ "Branch" | localize }}</label>
          <div class="w-100">
            <p-multiSelect
              class="w-inherit msl-branch"
              [options]="branches"
              [(ngModel)]="filterBranch"
              defaultLabel="Select a Branch"
              optionLabel="name"
              (onChange)="onSelectChangeBranch($event)">
            </p-multiSelect>
          </div>
        </div>
      </div>
    </div>
    
    <div class="card-body mb-0">
      <!-- COMMENT USING LATER -->

      <ng-container *ngFor="let branch of filterBranch ; let isLast = last">
        <ng-container *ngIf="getQuantityChartByBranch(branch.id) || getPercentageChartByBranch(branch.id)">
          <div class="branch-chart-section mb-5">
            <div class="d-flex justify-content-between">
              <div class="d-flex gap-4">
                <h4 class="branch-title mb-3">
                <i class="pi pi-building mr-2"></i>
                  {{ (branch.displayName || branch.name) + ' ' + 'Branch' + ' - ' + ("Total CVs" | localize) +': ' +  formatNumber(getTotalCVByBranch(branch.id))}}
              </h4>
              </div>
              <p-checkbox
                [(ngModel)]="filterModeMap[branch.id]"
                binary="true"
                inputId="toggleFilter-{{ branch.id }}"
                styleClass="section-title text-sm"
                label="{{ 'Hide universities or statuses with no data' | localize }}">
              </p-checkbox>
            </div>

            <div class="charts-container">
              <quantity-chart 
                *ngIf="getQuantityChartByBranch(branch.id)"
                [filterEnabled]="filterModeMap[branch.id]"
                [chartData]="[getQuantityChartByBranch(branch.id)]">
              </quantity-chart>
              
              <percentage-chart 
                *ngIf="getPercentageChartByBranch(branch.id)"
                [filterEnabled]="filterModeMap[branch.id]"
                [chartData]="[getPercentageChartByBranch(branch.id)]">
              </percentage-chart>
            </div>
          </div>
        </ng-container>
        <div *ngIf="!isLast" class="divider"></div>
      </ng-container>
      
    </div>
  </div>
</section>
